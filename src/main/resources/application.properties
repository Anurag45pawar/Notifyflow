spring.application.name=NotifyFlow
server.port=8080

# ---- Database (MySQL) ----
# The database is created automatically if it does not exist.
# Set DB_USERNAME / DB_PASSWORD as environment variables (or in your IDE run configuration).
spring.datasource.url=jdbc:mysql://localhost:3306/notifyflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=virat123

# ---- JPA (provider-neutral settings) ----
# JPA is the persistence specification; the runtime still needs a JPA provider.
# For production, manage schema changes with Flyway/Liquibase or SQL migrations.
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---- NotifyFlow processing settings ----
# Total delivery attempts allowed per notification (first try + retries)
notifyflow.max-attempts=3
# Base delay before a retry; doubles after every failed attempt (10s, 20s, 40s ...)
notifyflow.retry-delay-seconds=10
# Maximum notifications picked up per scheduler run
notifyflow.batch-size=20
# A notification stuck in PROCESSING longer than this is put back to PENDING
notifyflow.processing-timeout-seconds=60
# Simulated delivery: probability (0.0 - 1.0) that a delivery attempt fails
notifyflow.simulated-failure-rate=0.3
# Background scheduler
notifyflow.scheduler.enabled=true
notifyflow.scheduler.delay-ms=5000

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics

