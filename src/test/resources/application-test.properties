spring.datasource.url=jdbc:h2:mem:notifyflow_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false

# Tests call the processor directly, so the background scheduler is switched off
notifyflow.scheduler.enabled=false
# Deterministic delivery: succeeds unless the message contains [fail]
notifyflow.simulated-failure-rate=0
